

version: "3.8"
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.gpu
    container_name: gnn_backend
    ports:
      - "8000:8000"
    depends_on:
      - mongodb
    environment:
      PYTHONPATH: /app:/app/gns-fragment:/app/src
    volumes:
      - ./backend:/app/src
    working_dir: /app/src

  mongodb:
    image: mongo:7.0
    container_name: structural_sim_mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data: